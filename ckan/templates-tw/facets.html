<!-- Active Filters Block -->
<div class="w-80 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-medium text-gray-700 dark:text-gray-300">Active Filters</h3>
        <button class="text-xs text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300">
            Clear all
        </button>
    </div>

    <!-- Grouped Active Filters -->
    <div class="space-y-3">
        <!-- Category Group -->
        <div>
            <div class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Category</div>
            <div class="flex flex-wrap gap-1.5">
                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-100 dark:bg-emerald-900 text-emerald-800 dark:text-emerald-200 text-xs rounded-full">
                    Government
                    <button class="ml-0.5 hover:text-emerald-900 dark:hover:text-emerald-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>

                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-100 dark:bg-emerald-900 text-emerald-800 dark:text-emerald-200 text-xs rounded-full">
                    Health
                    <button class="ml-0.5 hover:text-emerald-900 dark:hover:text-emerald-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            </div>
        </div>

        <!-- Format Group -->
        <div>
            <div class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Format</div>
            <div class="flex flex-wrap gap-1.5">
                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 text-xs rounded-full">
                    CSV
                    <button class="ml-0.5 hover:text-purple-900 dark:hover:text-purple-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>

                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 text-xs rounded-full">
                    JSON
                    <button class="ml-0.5 hover:text-purple-900 dark:hover:text-purple-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            </div>
        </div>

        <!-- Organization Group -->
        <div>
            <div class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Organization</div>
            <div class="flex flex-wrap gap-1.5">
                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-orange-100 dark:bg-orange-900 text-orange-800 dark:text-orange-200 text-xs rounded-full">
                    City Hall
                    <button class="ml-0.5 hover:text-orange-900 dark:hover:text-orange-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            </div>
        </div>

        <!-- Tags Group -->
        <div>
            <div class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Tags</div>
            <div class="flex flex-wrap gap-1.5">
                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-cyan-100 dark:bg-cyan-900 text-cyan-800 dark:text-cyan-200 text-xs rounded-full">
                    Open Data
                    <button class="ml-0.5 hover:text-cyan-900 dark:hover:text-cyan-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>

                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-cyan-100 dark:bg-cyan-900 text-cyan-800 dark:text-cyan-200 text-xs rounded-full">
                    Real-time
                    <button class="ml-0.5 hover:text-cyan-900 dark:hover:text-cyan-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            </div>
        </div>
    </div>
</div>

<!-- Facet Container with One Facet -->
<div class="w-80 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg">

    <!-- Single Facet with Search and Accordion -->
    <div class="border-b border-gray-200 dark:border-gray-700 last:border-b-0">
        <!-- Facet Header -->
        <button
            class="flex items-center justify-between w-full px-4 py-3 text-left hover:bg-gray-50 dark:hover:bg-gray-700">
            <h3 class="text-sm font-medium text-gray-900 dark:text-gray-100">Category</h3>
            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500 dark:text-gray-400"></i>
        </button>

        <!-- Facet Content (Expanded State) -->
        <div class="px-4 pb-4">
            <!-- Search within facet -->
            <div class="relative mb-3">
                <i data-lucide="search"
                    class="absolute left-3 top-1/2 transform -translate-y-1/2 w-3 h-3 text-gray-400 dark:text-gray-500"></i>
                <input type="text" placeholder="Search categories..."
                    class="w-full pl-8 pr-3 py-1.5 text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 rounded focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Facet Options -->
            <div class="space-y-2 max-h-48 overflow-y-auto">
                <label
                    class="flex items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 px-2 py-1 rounded">
                    <input type="checkbox"
                        class="rounded border-gray-300 dark:border-gray-600 text-blue-600 dark:text-blue-400 bg-white dark:bg-gray-700 focus:ring-blue-500"
                        checked>
                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300 flex-1">Government</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">124</span>
                </label>

                <label
                    class="flex items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 px-2 py-1 rounded">
                    <input type="checkbox"
                        class="rounded border-gray-300 dark:border-gray-600 text-blue-600 dark:text-blue-400 bg-white dark:bg-gray-700 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300 flex-1">Education</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">89</span>
                </label>

                <label
                    class="flex items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 px-2 py-1 rounded">
                    <input type="checkbox"
                        class="rounded border-gray-300 dark:border-gray-600 text-blue-600 dark:text-blue-400 bg-white dark:bg-gray-700 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300 flex-1">Health</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">67</span>
                </label>

                <label
                    class="flex items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 px-2 py-1 rounded">
                    <input type="checkbox"
                        class="rounded border-gray-300 dark:border-gray-600 text-blue-600 dark:text-blue-400 bg-white dark:bg-gray-700 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300 flex-1">Transportation</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">45</span>
                </label>

                <label
                    class="flex items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 px-2 py-1 rounded">
                    <input type="checkbox"
                        class="rounded border-gray-300 dark:border-gray-600 text-blue-600 dark:text-blue-400 bg-white dark:bg-gray-700 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300 flex-1">Environment</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">78</span>
                </label>

                <label
                    class="flex items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 px-2 py-1 rounded">
                    <input type="checkbox"
                        class="rounded border-gray-300 dark:border-gray-600 text-blue-600 dark:text-blue-400 bg-white dark:bg-gray-700 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300 flex-1">Finance</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">32</span>
                </label>

                <label
                    class="flex items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 px-2 py-1 rounded">
                    <input type="checkbox"
                        class="rounded border-gray-300 dark:border-gray-600 text-blue-600 dark:text-blue-400 bg-white dark:bg-gray-700 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300 flex-1">Culture & Recreation</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">28</span>
                </label>

                <label
                    class="flex items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 px-2 py-1 rounded">
                    <input type="checkbox"
                        class="rounded border-gray-300 dark:border-gray-600 text-blue-600 dark:text-blue-400 bg-white dark:bg-gray-700 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300 flex-1">Social Services</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">56</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Example of Collapsed Facet -->
    <div class="border-b border-gray-200 dark:border-gray-700 last:border-b-0">
        <button
            class="flex items-center justify-between w-full px-4 py-3 text-left hover:bg-gray-50 dark:hover:bg-gray-700">
            <h3 class="text-sm font-medium text-gray-900 dark:text-gray-100">Format</h3>
            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500 dark:text-gray-400"></i>
        </button>
    </div>

    <!-- Another Example of Collapsed Facet -->
    <div class="border-b border-gray-200 dark:border-gray-700 last:border-b-0">
        <button
            class="flex items-center justify-between w-full px-4 py-3 text-left hover:bg-gray-50 dark:hover:bg-gray-700">
            <h3 class="text-sm font-medium text-gray-900 dark:text-gray-100">Organization</h3>
            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500 dark:text-gray-400"></i>
        </button>
    </div>

</div>
