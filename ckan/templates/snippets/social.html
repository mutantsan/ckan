{% set current_url = h.full_current_url() %}

{% block social %}
    <div class="card mb-4">
        <div class="card-header">
            {% block social_title %}
            <h3><i class="fs-4 fa fa-share-square"></i> {{ _('Social') }}</h3>
            {% endblock %}
        </div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item">
                <a href="https://x.com/share?url={{ current_url }}" target="_blank"><i
                        class="fa-brands fa-square-x-twitter"></i> X</a>
            </li>
            <li class="list-group-item">
                <a href="https://www.facebook.com/sharer.php?u={{ current_url }}" target="_blank"><i
                        class="fa-brands fa-facebook-square"></i> Facebook</a>
            </li>

        </ul>
    </div>
{% endblock %}
